version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    ignore:
      # No Dockerfile yet; this entry is a placeholder for future use.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
